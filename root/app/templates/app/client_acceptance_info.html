{% extends "admin/base_site.html" %}
{% load static %}

{% block content %}
<div style="max-width:800px; margin:auto;">
    <h1 style="margin-bottom:20px;">Client Acceptance Details</h1>

    <h2 style="color:#007bff;">Booking: {{ booking.booking_number }}</h2>

    <table class="table" style="width:100%; border-collapse:collapse;">
        <tbody>
            {% for label, value in fields.items %}
            <tr>
                <th style="text-align:left; padding:8px; border-bottom:1px solid #ddd; width:250px;">
                    {{ label }}
                </th>
                <td style="padding:8px; border-bottom:1px solid #ddd;">
                    {{ value }}
                </td>
            </tr>
            {% endfor %}
        </tbody>
    </table>

    <div style="margin-top:20px;">
        <a href="{% url 'admin:app_booking_changelist' %}" class="button"
           style="background-color:#6c757d;color:white;padding:8px 12px;border-radius:5px;text-decoration:none;">
            ← Back to Bookings
        </a>
    </div>
</div>
{% endblock %}
