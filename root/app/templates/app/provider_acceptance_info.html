{% extends "admin/base_site.html" %}
{% block content %}
<h1>{{ title }}</h1>

<table class="admin-table" style="border-collapse:collapse;width:70%;margin-top:20px;">
  {% for label, value in fields.items %}
  <tr style="border-bottom:1px solid #ccc;">
    <th style="text-align:left;padding:8px;background:#f9f9f9;width:30%;">{{ label }}</th>
    <td style="padding:8px;">{{ value }}</td>
  </tr>
  {% endfor %}
</table>

<p style="margin-top:20px;">
  <a href="/admin/app/booking/{{ booking.id }}/change/" class="button" style="background-color:#007bff;color:white;padding:6px 12px;border-radius:4px;text-decoration:none;">
    ⬅ Back to Booking
  </a>
</p>
{% endblock %}
